<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>binjamin classifier bench</title>
  <style>
    :root { --bg: #fafaf7; --ink: #1d1b19; --muted: #6b6b6b; --line: #e3e1da; --ok: #1f8a4c; --bad: #c0392b; --rec: #2369e0; --land: #4a4643; --nt: #b5651d; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 4px 0 12px; color: var(--muted); max-width: 70ch; }
    code { background: #eee; padding: 1px 4px; border-radius: 4px; }
    #drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; background: #fff; cursor: pointer; }
    #drop.over { border-color: var(--rec); }
    #status { margin: 12px 0; font-weight: 600; }
    #summary { margin: 0 0 12px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .body { padding: 10px; }
    .verdict { font-weight: 700; font-size: 16px; }
    .recycle { color: var(--rec); } .landfill { color: var(--land); } .nottrash { color: var(--nt); } .confused { color: var(--muted); }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    .src { color: var(--muted); font-size: 12px; }
    .model { margin-top: 6px; font-size: 12px; }
    .model b { display: block; color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>
  <h1>classifier bench</h1>
  <p>Drop photos of trash to see what Binjamin would say, and why. Tip: start file names with the right bin
    (<code>recycle_</code>, <code>landfill_</code>, <code>nottrash_</code>) and you get an accuracy score.
    Uses the same settings as the app (<code>js/config.js</code>, <code>js/trash-labels.js</code>).</p>
  <label id="drop">drop images here, or tap to pick<input id="file" type="file" accept="image/*" multiple hidden></label>
  <div id="status">loading models…</div>
  <div id="summary"></div>
  <div id="grid"></div>
  <script type="module" src="js/bench.js"></script>
</body>
</html>
